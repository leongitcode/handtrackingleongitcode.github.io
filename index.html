<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat Saber – Hand Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #0a0a0a;
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.6;
        }
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        #three-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        #score-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 48px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.6), 0 0 60px rgba(0, 200, 255, 0.3);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 32px;
            border-radius: 16px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #score-display span {
            color: #ffcc00;
        }

        #combo-display {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 100, 200, 0.5);
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.15s;
        }
        #combo-display .combo-num {
            color: #ff6bff;
            font-weight: 800;
        }

        #status {
            position: absolute;
            bottom: 20px;
            right: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 300;
        }
        #status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #44ff88;
            margin-right: 8px;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        #instructions {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
            font-weight: 300;
        }

        #miss-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 50, 50, 0.6);
            font-size: 72px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.1s;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.4);
            pointer-events: none;
        }
        #miss-overlay.show {
            opacity: 1;
        }

        #saber-labels {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #saber-labels .left {
            color: rgba(255, 80, 80, 0.4);
        }
        #saber-labels .right {
            color: rgba(80, 180, 255, 0.4);
        }

        @media (max-width: 700px) {
            #score-display {
                font-size: 28px;
                padding: 4px 16px;
                top: 16px;
            }
            #combo-display {
                font-size: 18px;
                bottom: 40px;
                padding: 4px 16px;
            }
            #instructions {
                font-size: 11px;
                bottom: 80px;
                padding: 4px 14px;
            }
            #status {
                font-size: 10px;
                bottom: 12px;
                right: 12px;
            }
            #saber-labels {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" playsinline></video>
    </div>

    <div id="three-container"></div>

    <div id="ui-overlay">
        <div id="score-display">⚡ <span id="score-num">0</span></div>
        <div id="combo-display">🔥 combo × <span class="combo-num" id="combo-num">0</span></div>
        <div id="instructions">✋ move hands to slice · blocks fly toward you</div>
        <div id="status"><span class="dot"></span> tracking</div>
        <div id="miss-overlay">✕ MISS</div>
        <div id="saber-labels">
            <span class="left">◀ left saber</span>
            <span class="right">right saber ▶</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>

    <script>
        // ─── CONFIG ────────────────────────────────────────────────
        const CONFIG = {
            blockSpeed: 0.12,
            spawnInterval: 800,
            maxBlocks: 30,
            saberLength: 1.8,
            sliceRadius: 1.1,
            handSmooth: 0.25,
            zFar: -18,
            zNear: 6,
            scorePerSlice: 100,
            comboMultiplier: 1.0,
        };

        // ─── DOM REFS ──────────────────────────────────────────────
        const video = document.getElementById('webcam');
        const threeContainer = document.getElementById('three-container');
        const scoreNum = document.getElementById('score-num');
        const comboNum = document.getElementById('combo-num');
        const missOverlay = document.getElementById('miss-overlay');

        // ─── THREE.JS SETUP ───────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 12, 28);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.position.set(0, 1.6, 4.5);
        camera.lookAt(0, 0, -6);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        threeContainer.appendChild(renderer.domElement);

        // ─── LIGHTS ────────────────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0x222244, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x4488ff, 0.6);
        rimLight.position.set(-5, 0, -5);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xff66aa, 0.3);
        fillLight.position.set(0, -3, 5);
        scene.add(fillLight);

        // subtle glow points
        const glowColors = [0xff3366, 0x33aaff, 0xffaa33];
        for (let i = 0; i < 6; i++) {
            const g = new THREE.PointLight(glowColors[i % 3], 0.3, 12);
            g.position.set(
                (Math.random() - 0.5) * 14,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 10 - 6
            );
            scene.add(g);
        }

        // ─── FLOOR GRID ────────────────────────────────────────────
        const gridHelper = new THREE.GridHelper(30, 20, 0x4466ff, 0x2244aa);
        gridHelper.position.y = -2.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);

        // glow rings on floor
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.RingGeometry(1.5 + i * 1.8, 1.8 + i * 1.8, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.06 - i * 0.015,
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -2.15;
            scene.add(ring);
        }

        // ─── GAME STATE ────────────────────────────────────────────
        const blocks = [];
        const slices = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalSliced = 0;
        let totalMissed = 0;
        let lastSpawnTime = 0;
        let gameRunning = true;

        // hand states
        const hands = {
            left: {
                pos: new THREE.Vector3(-2, 0, 0),
                prevPos: new THREE.Vector3(-2, 0, 0),
                vel: new THREE.Vector3(),
                active: false,
                landmarks: null,
                saber: null,
                trail: [],
                color: 0xff4466,
            },
            right: {
                pos: new THREE.Vector3(2, 0, 0),
                prevPos: new THREE.Vector3(2, 0, 0),
                vel: new THREE.Vector3(),
                active: false,
                landmarks: null,
                saber: null,
                trail: [],
                color: 0x44aaff,
            }
        };

        // ─── SABER OBJECTS ─────────────────────────────────────────
        function createSaber(color) {
            const group = new THREE.Group();

            // blade glow
            const bladeGeo = new THREE.CylinderGeometry(0.035, 0.045, CONFIG.saberLength, 8, 1);
            const bladeMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9,
            });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = CONFIG.saberLength / 2;
            blade.castShadow = true;
            group.add(blade);

            // inner bright core
            const coreGeo = new THREE.CylinderGeometry(0.015, 0.02, CONFIG.saberLength * 0.9, 6);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.5,
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = CONFIG.saberLength / 2;
            group.add(core);

            // glow aura (point light)
            const glow = new THREE.PointLight(color, 0.8, 4);
            glow.position.y = CONFIG.saberLength / 2;
            group.add(glow);

            // handle
            const handleGeo = new THREE.CylinderGeometry(0.055, 0.07, 0.25, 8);
            const handleMat = new THREE.MeshStandardMaterial({
                color: 0x222233,
                metalness: 0.8,
                roughness: 0.3,
            });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -0.05;
            handle.castShadow = true;
            group.add(handle);

            // handle ring
            const ringGeo2 = new THREE.TorusGeometry(0.065, 0.015, 8, 12);
            const ringMat2 = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.6,
                roughness: 0.3,
                emissive: color,
                emissiveIntensity: 0.2,
            });
            const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
            ring2.position.y = 0.08;
            ring2.rotation.x = Math.PI / 2;
            group.add(ring2);

            // tip glow
            const tipGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const tipMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.7,
            });
            const tip = new THREE.Mesh(tipGeo, tipMat);
            tip.position.y = CONFIG.saberLength + 0.02;
            group.add(tip);

            // trail particles (will be managed separately)
            group.userData.trailParticles = [];
            group.userData.trailPositions = [];

            return group;
        }

        // ─── BLOCK FACTORY ──────────────────────────────────────────
        function createBlock() {
            const size = 0.55 + Math.random() * 0.25;
            const color = new THREE.Color().setHSL(Math.random() * 0.8 + 0.1, 0.9, 0.55);

            // main cube
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.2,
                roughness: 0.4,
                emissive: color,
                emissiveIntensity: 0.15,
                transparent: true,
                opacity: 0.95,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // glow edge
            const edgeGeo = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5,
            });
            const edge = new THREE.LineSegments(edgeGeo, edgeMat);
            mesh.add(edge);

            // inner glow sphere
            const innerGeo = new THREE.SphereGeometry(size * 0.2, 8, 8);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
            });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            mesh.add(inner);

            // position
            const x = (Math.random() - 0.5) * 9;
            const y = (Math.random() - 0.5) * 4.5 + 0.5;
            const z = CONFIG.zFar + (Math.random() - 0.5) * 4;

            mesh.position.set(x, y, z);
            mesh.rotation.set(
                Math.random() * 0.5,
                Math.random() * 0.5,
                Math.random() * 0.5
            );

            // random direction hint (visual arrow)
            const dir = Math.floor(Math.random() * 4);
            const arrowColors = [0xff4444, 0x44ff44, 0x4488ff, 0xffaa44];
            const arrowDir = [
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, -1, 0),
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0)
            ];
            const arrow = new THREE.ArrowHelper(
                arrowDir[dir],
                new THREE.Vector3(0, 0, 0),
                size * 0.5,
                arrowColors[dir],
                0.15,
                0.1
            );
            mesh.add(arrow);

            // store data
            mesh.userData = {
                color: color,
                size: size,
                speed: CONFIG.blockSpeed * (0.85 + Math.random() * 0.3),
                sliced: false,
                spawnZ: z,
                rotSpeed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03
                ),
                dir: dir,
                arrowDir: arrowDir[dir],
            };

            return mesh;
        }

        // ─── SLICE EFFECT ──────────────────────────────────────────
        function createSliceEffect(position, color, size) {
            const count = 30;
            const particles = [];

            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const velocities = [];
            const lifetimes = [];

            const baseColor = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 0.8;
                const r = 0.2 + Math.random() * 0.6;

                positions[i * 3] = position.x + Math.sin(theta) * Math.cos(phi) * r;
                positions[i * 3 + 1] = position.y + Math.sin(phi) * r * 0.6;
                positions[i * 3 + 2] = position.z + Math.cos(theta) * Math.cos(phi) * r;

                const c = baseColor.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.5);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                sizes[i] = 0.04 + Math.random() * 0.12;
                velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.15,
                    (Math.random() - 0.5) * 0.15 + 0.05,
                    (Math.random() - 0.5) * 0.15
                ));
                lifetimes.push(0.6 + Math.random() * 0.5);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const mesh = new THREE.Points(geo, mat);

            scene.add(mesh);

            return {
                mesh,
                velocities,
                lifetimes,
                age: 0,
                maxAge: 1.2,
                update(dt) {
                    this.age += dt;
                    const pos = this.mesh.geometry.attributes.position;
                    const arr = pos.array;
                    const life = Math.max(0, 1 - this.age / this.maxAge);
                    this.mesh.material.opacity = life * 0.9;

                    for (let i = 0; i < count; i++) {
                        arr[i * 3] += velocities[i].x * dt * 1.5;
                        arr[i * 3 + 1] += velocities[i].y * dt * 1.5;
                        arr[i * 3 + 2] += velocities[i].z * dt * 1.5;
                        velocities[i].y -= dt * 0.1;
                        velocities[i].x *= 0.99;
                        velocities[i].z *= 0.99;
                    }
                    pos.needsUpdate = true;
                    return this.age < this.maxAge;
                }
            };
        }

        // ─── HAND TRACKING → 3D MAPPING ─────────────────────────
        function mapHandTo3D(landmarks, w, h) {
            if (!landmarks || landmarks.length < 21) return null;

            const wrist = landmarks[0];
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            // Use wrist for position, but also get depth from hand
            const x = (wrist.x - 0.5) * 10;
            const y = (0.5 - wrist.y) * 7;
            // z from mediapipe (0 at wrist, positive toward camera)
            // map to scene z: -2 to 4
            const z = -1.5 + wrist.z * 8;

            // hand size for depth scaling
            const handSize = Math.sqrt(
                Math.pow(landmarks[5].x - landmarks[17].x, 2) +
                Math.pow(landmarks[5].y - landmarks[17].y, 2) +
                Math.pow(landmarks[5].z - landmarks[17].z, 2)
            );

            // direction of index finger
            const dir = new THREE.Vector3(
                indexTip.x - wrist.x,
                indexTip.y - wrist.y,
                indexTip.z - wrist.z
            ).normalize();

            const pos = new THREE.Vector3(x, y, z);

            return {
                pos,
                dir,
                handSize,
                wrist,
                indexTip,
                thumbTip,
            };
        }

        // ─── SLICE DETECTION ──────────────────────────────────────
        function checkSlice(handPos, prevPos, handColor, handName) {
            const speed = handPos.distanceTo(prevPos);
            if (speed < 0.06) return; // too slow

            const dir = new THREE.Vector3().copy(handPos).sub(prevPos).normalize();

            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];
                if (block.userData.sliced) continue;

                const toBlock = new THREE.Vector3().copy(block.position).sub(handPos);
                const dist = toBlock.length();

                // Check if hand is near block
                if (dist < CONFIG.sliceRadius * 0.7) {
                    // Check if hand moved through block (projection)
                    const proj = toBlock.dot(dir);
                    if (proj > -0.3 && proj < 0.8) {
                        // Check if block is close to the line of movement
                        const perpDist = toBlock.clone().add(dir.clone().multiplyScalar(-proj)).length();
                        if (perpDist < CONFIG.sliceRadius * 0.6) {
                            // SLICE!
                            block.userData.sliced = true;
                            const pos = block.position.clone();

                            // create slice effect
                            const effect = createSliceEffect(pos, handColor, block.userData.size);
                            slices.push(effect);

                            // score
                            const bonus = Math.floor(combo / 5) + 1;
                            const points = CONFIG.scorePerSlice + bonus * 10;
                            score += points;
                            combo++;
                            if (combo > maxCombo) maxCombo = combo;
                            totalSliced++;

                            updateUI();

                            // remove block with animation
                            scene.remove(block);
                            blocks.splice(i, 1);

                            // spawn a few particles
                            for (let j = 0; j < 6; j++) {
                                const p = createSliceEffect(
                                    pos.clone().add(new THREE.Vector3(
                                        (Math.random() - 0.5) * 0.6,
                                        (Math.random() - 0.5) * 0.6,
                                        (Math.random() - 0.5) * 0.6
                                    )),
                                    handColor,
                                    0.2
                                );
                                slices.push(p);
                            }

                            // combo popup
                            if (combo > 0 && combo % 5 === 0) {
                                showComboPopup(combo);
                            }

                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ─── COMBO POPUP ──────────────────────────────────────────
        let comboPopupTimeout = null;

        function showComboPopup(c) {
            const el = document.getElementById('combo-display');
            el.style.transform = 'translateX(-50%) scale(1.3)';
            el.style.color = '#ff88ff';
            setTimeout(() => {
                el.style.transform = 'translateX(-50%) scale(1)';
                el.style.color = '#fff';
            }, 200);
        }

        // ─── UI UPDATE ────────────────────────────────────────────
        function updateUI() {
            scoreNum.textContent = score;
            comboNum.textContent = combo;
        }

        // ─── MISS HANDLER ──────────────────────────────────────────
        function handleMiss() {
            combo = 0;
            totalMissed++;
            updateUI();
            missOverlay.classList.add('show');
            setTimeout(() => missOverlay.classList.remove('show'), 300);
        }

        // ─── SPAWN BLOCKS ──────────────────────────────────────────
        function spawnBlock() {
            if (blocks.length >= CONFIG.maxBlocks) return;
            const block = createBlock();
            scene.add(block);
            blocks.push(block);
        }

        // ─── UPDATE BLOCKS ─────────────────────────────────────────
        function updateBlocks(dt) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];
                // move toward player
                block.position.z += block.userData.speed * dt * 2.5;

                // rotate
                block.rotation.x += block.userData.rotSpeed.x;
                block.rotation.y += block.userData.rotSpeed.y;
                block.rotation.z += block.userData.rotSpeed.z;

                // pulse glow
                const pulse = 0.8 + 0.2 * Math.sin(Date.now() * 0.003 + i);
                block.material.emissiveIntensity = 0.1 + pulse * 0.15;

                // check if passed player (miss)
                if (block.position.z > CONFIG.zNear) {
                    if (!block.userData.sliced) {
                        handleMiss();
                    }
                    scene.remove(block);
                    blocks.splice(i, 1);
                }
            }
        }

        // ─── UPDATE SABER TRAIL ──────────────────────────────────
        function updateSaberTrail(hand, dt) {
            const trail = hand.trail;
            trail.push(hand.pos.clone());
            if (trail.length > 18) trail.shift();

            // update saber position
            if (hand.saber) {
                hand.saber.position.copy(hand.pos);

                // orient saber toward movement direction or forward
                if (hand.vel.length() > 0.01) {
                    const lookTarget = hand.pos.clone().add(hand.vel.clone().normalize());
                    hand.saber.lookAt(lookTarget);
                } else {
                    hand.saber.rotation.set(0, 0, 0);
                }

                // tilt based on velocity
                const tilt = Math.min(hand.vel.length() * 0.5, 0.6);
                hand.saber.rotation.z += hand.vel.x * 0.2;
                hand.saber.rotation.x += hand.vel.y * 0.1;

                // brightness based on speed
                const intensity = Math.min(0.5 + hand.vel.length() * 2, 2.0);
                const light = hand.saber.children.find(c => c.isPointLight);
                if (light) light.intensity = intensity * 0.6;

                // blade opacity
                const blade = hand.saber.children.find(c => c.isMesh && c.geometry.type === 'CylinderGeometry');
                if (blade) {
                    blade.material.opacity = 0.6 + Math.min(hand.vel.length() * 3, 0.4);
                }
            }
        }

        // ─── RENDER LOOP ───────────────────────────────────────────
        let lastTime = 0;

        function animate(time) {
            const dt = Math.min((time - lastTime) / 16.667, 3);
            lastTime = time;

            // spawn blocks
            if (time - lastSpawnTime > CONFIG.spawnInterval) {
                spawnBlock();
                // sometimes spawn extra
                if (Math.random() < 0.2 && blocks.length < CONFIG.maxBlocks - 2) {
                    setTimeout(() => spawnBlock(), 100);
                }
                lastSpawnTime = time;
            }

            // update blocks
            updateBlocks(dt);

            // update slice effects
            for (let i = slices.length - 1; i >= 0; i--) {
                const s = slices[i];
                const alive = s.update(dt);
                if (!alive) {
                    scene.remove(s.mesh);
                    slices.splice(i, 1);
                }
            }

            // update sabers
            for (const key of ['left', 'right']) {
                const hand = hands[key];
                if (hand.active && hand.saber) {
                    updateSaberTrail(hand, dt);
                }
            }

            // auto-spawn if not enough blocks
            if (blocks.length < 8 && Math.random() < 0.05) {
                spawnBlock();
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ─── RESIZE ────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ─── MEDIAPIPE HANDS ──────────────────────────────────────
        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                for (const key of ['left', 'right']) {
                    hands[key].active = false;
                    if (hands[key].saber) {
                        hands[key].saber.visible = false;
                    }
                }
                return;
            }

            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;

            // Process each hand
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i]?.label || 'Right';
                const isLeft = handedness === 'Left';

                const key = isLeft ? 'left' : 'right';
                const hand = hands[key];

                const mapped = mapHandTo3D(landmarks, w, h);
                if (!mapped) continue;

                // smooth position
                const targetPos = mapped.pos;
                if (hand.active) {
                    hand.pos.lerp(targetPos, CONFIG.handSmooth);
                } else {
                    hand.pos.copy(targetPos);
                    hand.active = true;
                }

                hand.prevPos.copy(hand.pos);
                hand.vel.copy(hand.pos).sub(hand.prevPos).multiplyScalar(1 / 0.016);

                // create saber if not exists
                if (!hand.saber) {
                    hand.saber = createSaber(hand.color);
                    scene.add(hand.saber);
                }
                hand.saber.visible = true;

                // update hand data
                hand.landmarks = landmarks;

                // check slices
                if (hand.prevPos && hand.pos) {
                    checkSlice(hand.pos, hand.prevPos, hand.color, key);
                }

                // store for next frame
                hand.prevPos.copy(hand.pos);
            }

            // Hide sabers for hands not detected
            for (const key of ['left', 'right']) {
                if (!hands[key].active) {
                    if (hands[key].saber) hands[key].saber.visible = false;
                }
            }
        }

        // ─── INIT MEDIAPIPE ──────────────────────────────────────
        const handsInstance = new Hands({
            locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        handsInstance.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.6,
        });

        handsInstance.onResults(onResults);

        // ─── CAMERA ────────────────────────────────────────────────
        const cameraHelper = new Camera(video, {
            onFrame: async () => {
                try {
                    await handsInstance.send({ image: video });
                } catch (e) {
                    // silently handle
                }
            },
            width: 640,
            height: 480,
        });

        cameraHelper.start();

        // ─── START GAME ────────────────────────────────────────────
        updateUI();
        requestAnimationFrame(animate);

        // spawn initial blocks
        for (let i = 0; i < 10; i++) {
            setTimeout(() => spawnBlock(), i * 120);
        }

        console.log('🔥 Beat Saber with Hand Tracking!');
        console.log('📐 Move your hands to slice blocks.');

        // ─── KEYBOARD SHORTCUTS (debug) ──────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                // reset score
                score = 0;
                combo = 0;
                updateUI();
            }
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                // spawn a block
                spawnBlock();
            }
        });
    </script>
</body>
</html>
