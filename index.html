<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Hand Cursor Lab - Fresh Build</title>
  
  <!-- Load MediaPipe dependencies -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #141419;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 24px;
      color: #ff3366;
    }

    p.instructions {
      text-align: center;
      margin: 0 0 20px 0;
      color: #aaa;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-grow: 1;
    }

    .test-card {
      background: #1e1e24;
      border: 2px solid #2d2d35;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .card-title {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    #virtual-cursor {
      position: absolute;
      width: 24px;
      height: 24px;
      background-color: #ff3366;
      border-radius: 50%;
      pointer-events: none; 
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
    }

    #virtual-cursor.clicking {
      background-color: #00ff66;
      width: 16px;
      height: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.9);
    }

    .test-btn {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #3399ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background-color 0.2s, transform 0.1s;
    }

    .test-btn.hovered {
      background-color: #0077e6;
      transform: scale(1.03);
    }

    .btn-danger { background-color: #ff3333; }
    .btn-danger.hovered { background-color: #cc0000; }

    .btn-success { background-color: #00cc66; }
    .btn-success.hovered { background-color: #00994d; }

    .counter-display {
      font-size: 36px;
      font-weight: bold;
      color: #00ff66;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100%;
    }
    .key-btn {
      padding: 10px;
      font-size: 14px;
      background: #3a3a45;
    }
    .key-btn.hovered {
      background: #575766;
    }

    .toggle-box {
      width: 60px;
      height: 34px;
      background-color: #ccc;
      border-radius: 34px;
      position: relative;
      transition: background-color 0.3s;
    }
    .toggle-box::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-box.active {
      background-color: #00cc66;
    }
    .toggle-box.active::before {
      transform: translateX(26px);
    }

    #webcam {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 160px;
      height: 120px;
      transform: scaleX(-1);
      border: 2px solid #2d2d35;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <h1>Virtual Hand Cursor Lab</h1>
  <p class="instructions">Hover the red circle onto buttons, then <strong>Close your Fist / Palm</strong> to click!</p>

  <div class="grid-container">
    
    <div class="test-card">
      <div class="card-title">Score Clicker</div>
      <div class="counter-display" id="click-count">0</div>
      <button class="test-btn" id="btn-count">+ Add Score</button>
    </div>

    <div class="test-card">
      <div class="card-title">Toggle Matrix</div>
      <div class="toggle-box" id="test-toggle"></div>
      <button class="test-btn" id="btn-toggle">Switch States</button>
    </div>

    <div class="test-card">
      <div class="card-title">Alert Flags</div>
      <button class="test-btn btn-danger" id="btn-alert">Trigger Warning</button>
    </div>

    <div class="test-card">
      <div class="card-title">Color Shift</div>
      <button class="test-btn btn-success" id="btn-color">Invert Background</button>
    </div>

    <div class="test-card">
      <div class="card-title">Input Matrix</div>
      <div class="keypad">
        <button class="test-btn key-btn">1</button>
        <button class="test-btn key-btn">2</button>
        <button class="test-btn key-btn">3</button>
        <button class="test-btn key-btn">4</button>
        <button class="test-btn key-btn">5</button>
        <button class="test-btn key-btn">6</button>
      </div>
    </div>

    <div class="test-card">
      <div class="card-title">Reset Unit</div>
      <button class="test-btn" id="btn-reset" style="background-color: #777;">Clear Diagnostics</button>
    </div>

  </div>

  <video id="webcam" autoplay playsinline></video>
  <div id="virtual-cursor"></div>

  <script>
    const videoElement = document.getElementById('webcam');
    const cursorElement = document.getElementById('virtual-cursor');
    const allButtons = document.querySelectorAll('.test-btn');
    
    let counterValue = 0;
    let isFistClosed = false;

    document.getElementById('btn-count').addEventListener('click', () => {
      counterValue++;
      document.getElementById('click-count').innerText = counterValue;
    });

    document.getElementById('btn-toggle').addEventListener('click', () => {
      document.getElementById('test-toggle').classList.toggle('active');
    });

    document.getElementById('btn-alert').addEventListener('click', () => {
      alert("Virtual Hand Click Confirmed Successfully!");
    });

    document.getElementById('btn-color').addEventListener('click', () => {
      const currentBg = document.body.style.backgroundColor;
      document.body.style.backgroundColor = currentBg === 'rgb(41, 17, 47)' ? '#141419' : '#29112f';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      counterValue = 0;
      document.getElementById('click-count').innerText = 0;
      document.getElementById('test-toggle').classList.remove('active');
      document.body.style.backgroundColor = '#141419';
    });

    document.querySelectorAll('.key-btn').forEach(key => {
      key.addEventListener('click', () => {
        key.style.background = '#00ff66';
        setTimeout(() => key.style.background = '', 400);
      });
    });

    let currentX = window.innerWidth / 2;
    let currentY = window.innerHeight / 2;
    let targetX = currentX;
    let targetY = currentY;
    const SMOOTHING_FACTOR = 0.15; 

    function onResults(results) {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

      const landmarks = results.multiHandLandmarks[0].landmark;
      const handAnchor = landmarks[9]; // Middle knuckle anchor point

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      targetX = Math.max(0, Math.min(windowWidth, ((1 - handAnchor.x) - 0.15) / 0.7 * windowWidth));
      targetY = Math.max(0, Math.min(windowHeight, (handAnchor.y - 0.15) / 0.7 * windowHeight));

      let hoveredElement = null;
      allButtons.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        if (currentX >= rect.left && currentX <= rect.right && currentY >= rect.top && currentY <= rect.bottom) {
          btn.classList.add('hovered');
          hoveredElement = btn;
        } else {
          btn.classList.remove('hovered');
        }
      });

      const isIndexClosed  = landmarks[8].y  > landmarks[5].y;
      const isMiddleClosed = landmarks[12].y > landmarks[9].y;
      const isRingClosed   = landmarks[16].y > landmarks[13].y;
      const isPinkyClosed  = landmarks[20].y > landmarks[17].y;

      if (isIndexClosed && isMiddleClosed && isRingClosed && isPinkyClosed) {
        if (!isFistClosed) {
          isFistClosed = true;
          cursorElement.classList.add('clicking');
          if (hoveredElement) {
            hoveredElement.click();
          }
        }
      } else {
        isFistClosed = false;
        cursorElement.classList.remove('clicking');
      }
    }

    function updateCursorAnimation() {
      currentX += (targetX - currentX) * SMOOTHING_FACTOR;
      currentY += (targetY - currentY) * SMOOTHING_FACTOR;

      cursorElement.style.left = `${currentX}px`;
      cursorElement.style.top = `${currentY}px`;

      requestAnimationFrame(updateCursorAnimation);
    }
    requestAnimationFrame(updateCursorAnimation);

    const hands = new Hands({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
