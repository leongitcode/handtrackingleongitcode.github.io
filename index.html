<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat Saber – Inverted Hand Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #06060e;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #06060e;
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.35;
        }
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        #three-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        #score-display {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 44px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.5), 0 0 60px rgba(0, 200, 255, 0.2);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 28px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #score-display span {
            color: #ffcc00;
        }

        #combo-display {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 100, 200, 0.4);
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.15s;
        }
        #combo-display .combo-num {
            color: #ff6bff;
            font-weight: 800;
        }

        #status {
            position: absolute;
            bottom: 16px;
            right: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 12px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            font-weight: 300;
        }
        #status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #44ff88;
            margin-right: 6px;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        #instructions {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            font-weight: 300;
        }

        #miss-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 50, 50, 0.5);
            font-size: 60px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.1s;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.3);
            pointer-events: none;
        }
        #miss-overlay.show {
            opacity: 1;
        }

        #saber-labels {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            pointer-events: none;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #saber-labels .left {
            color: rgba(255, 80, 80, 0.3);
        }
        #saber-labels .right {
            color: rgba(80, 180, 255, 0.3);
        }

        @media (max-width: 700px) {
            #score-display {
                font-size: 28px;
                padding: 4px 16px;
                top: 16px;
            }
            #combo-display {
                font-size: 18px;
                bottom: 36px;
                padding: 4px 14px;
            }
            #instructions {
                font-size: 10px;
                bottom: 70px;
                padding: 3px 12px;
            }
            #status {
                font-size: 9px;
                bottom: 10px;
                right: 10px;
            }
            #saber-labels {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" playsinline></video>
    </div>

    <div id="three-container"></div>

    <div id="ui-overlay">
        <div id="score-display">⚡ <span id="score-num">0</span></div>
        <div id="combo-display">🔥 combo × <span class="combo-num" id="combo-num">0</span></div>
        <div id="instructions">✋ swing hands · slice blocks</div>
        <div id="status"><span class="dot"></span> tracking</div>
        <div id="miss-overlay">✕ MISS</div>
        <div id="saber-labels">
            <span class="left">◀ right saber</span>
            <span class="right">left saber ▶</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>

    <script>
        // ─── CONFIG ────────────────────────────────────────────────
        const CONFIG = {
            blockSpeed: 0.10,
            spawnInterval: 700,
            maxBlocks: 18,
            saberLength: 1.6,
            sliceRadius: 0.9,
            handSmooth: 0.35,
            zFar: -16,
            zNear: 5.5,
            scorePerSlice: 100,
            trailLength: 10,
            particleCount: 16,
        };

        // ─── DOM REFS ──────────────────────────────────────────────
        const video = document.getElementById('webcam');
        const threeContainer = document.getElementById('three-container');
        const scoreNum = document.getElementById('score-num');
        const comboNum = document.getElementById('combo-num');
        const missOverlay = document.getElementById('miss-overlay');

        // ─── THREE.JS SETUP ───────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08081a);
        scene.fog = new THREE.Fog(0x08081a, 10, 22);

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 35);
        camera.position.set(0, 1.4, 4.0);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        threeContainer.appendChild(renderer.domElement);

        // ─── LIGHTS (reduced) ──────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0x223355, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 0.9);
        mainLight.position.set(4, 8, 4);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 512;
        mainLight.shadow.mapSize.height = 512;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 20;
        mainLight.shadow.camera.left = -6;
        mainLight.shadow.camera.right = 6;
        mainLight.shadow.camera.top = 6;
        mainLight.shadow.camera.bottom = -6;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x4488ff, 0.4);
        rimLight.position.set(-4, 1, -5);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xff66aa, 0.2);
        fillLight.position.set(0, -2, 4);
        scene.add(fillLight);

        // just 2 glow points (reduced)
        const glowColors = [0xff3366, 0x33aaff];
        for (let i = 0; i < 2; i++) {
            const g = new THREE.PointLight(glowColors[i], 0.2, 10);
            g.position.set(
                (i === 0 ? -3 : 3),
                (i === 0 ? 1 : -0.5),
                -4 + i * 2
            );
            scene.add(g);
        }

        // ─── FLOOR GRID ────────────────────────────────────────────
        const gridHelper = new THREE.GridHelper(24, 16, 0x4466ff, 0x2233aa);
        gridHelper.position.y = -1.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);

        // simple ring
        const ringGeo = new THREE.RingGeometry(2.8, 3.2, 48);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x4488ff,
            transparent: true,
            opacity: 0.06,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -1.75;
        scene.add(ring);

        // ─── GAME STATE ────────────────────────────────────────────
        const blocks = [];
        const slices = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalSliced = 0;
        let totalMissed = 0;
        let lastSpawnTime = 0;
        let gameRunning = true;

        // hand states
        const hands = {
            left: {
                pos: new THREE.Vector3(-2, 0, 0),
                prevPos: new THREE.Vector3(-2, 0, 0),
                vel: new THREE.Vector3(),
                active: false,
                landmarks: null,
                saber: null,
                trail: [],
                color: 0xff4466,
                // Inverted: left hand controls RIGHT saber
                saberColor: 0x44aaff,
            },
            right: {
                pos: new THREE.Vector3(2, 0, 0),
                prevPos: new THREE.Vector3(2, 0, 0),
                vel: new THREE.Vector3(),
                active: false,
                landmarks: null,
                saber: null,
                trail: [],
                color: 0x44aaff,
                // Inverted: right hand controls LEFT saber
                saberColor: 0xff4466,
            }
        };

        // ─── SABER OBJECTS (simplified, smoother) ──────────────────
        function createSaber(color) {
            const group = new THREE.Group();

            // blade - simpler
            const bladeGeo = new THREE.CylinderGeometry(0.03, 0.04, CONFIG.saberLength, 6, 1);
            const bladeMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.85,
            });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = CONFIG.saberLength / 2;
            blade.castShadow = true;
            group.add(blade);

            // inner core
            const coreGeo = new THREE.CylinderGeometry(0.012, 0.016, CONFIG.saberLength * 0.85, 4);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.4,
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = CONFIG.saberLength / 2;
            group.add(core);

            // glow light (dimmed)
            const glow = new THREE.PointLight(color, 0.4, 3);
            glow.position.y = CONFIG.saberLength / 2;
            group.add(glow);

            // handle - simpler
            const handleGeo = new THREE.CylinderGeometry(0.05, 0.065, 0.2, 6);
            const handleMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                metalness: 0.7,
                roughness: 0.4,
            });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -0.04;
            handle.castShadow = true;
            group.add(handle);

            // tip
            const tipGeo = new THREE.SphereGeometry(0.04, 6, 6);
            const tipMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.6,
            });
            const tip = new THREE.Mesh(tipGeo, tipMat);
            tip.position.y = CONFIG.saberLength + 0.02;
            group.add(tip);

            return group;
        }

        // ─── BLOCK FACTORY (simpler) ──────────────────────────────
        function createBlock() {
            const size = 0.5 + Math.random() * 0.2;
            const hue = Math.random() * 0.7 + 0.15;
            const color = new THREE.Color().setHSL(hue, 0.85, 0.5);

            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.1,
                roughness: 0.5,
                emissive: color,
                emissiveIntensity: 0.12,
                transparent: true,
                opacity: 0.92,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // edge glow
            const edgeGeo = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3,
            });
            const edge = new THREE.LineSegments(edgeGeo, edgeMat);
            mesh.add(edge);

            const x = (Math.random() - 0.5) * 8;
            const y = (Math.random() - 0.5) * 4 + 0.3;
            const z = CONFIG.zFar + (Math.random() - 0.5) * 3;

            mesh.position.set(x, y, z);
            mesh.rotation.set(
                (Math.random() - 0.5) * 0.4,
                (Math.random() - 0.5) * 0.4,
                (Math.random() - 0.5) * 0.4
            );

            // direction arrow (simplified)
            const dir = Math.floor(Math.random() * 4);
            const arrowDir = [
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, -1, 0),
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0)
            ];
            const arrow = new THREE.ArrowHelper(
                arrowDir[dir],
                new THREE.Vector3(0, 0, 0),
                size * 0.4,
                0xffffff,
                0.1,
                0.08
            );
            mesh.add(arrow);

            mesh.userData = {
                color: color,
                size: size,
                speed: CONFIG.blockSpeed * (0.9 + Math.random() * 0.2),
                sliced: false,
                rotSpeed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                ),
                dir: dir,
                arrowDir: arrowDir[dir],
            };

            return mesh;
        }

        // ─── SLICE EFFECT (fewer particles) ──────────────────────
        function createSliceEffect(position, color, size) {
            const count = CONFIG.particleCount;
            const particles = [];

            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const velocities = [];
            const lifetimes = [];

            const baseColor = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 0.7;
                const r = 0.15 + Math.random() * 0.4;

                positions[i * 3] = position.x + Math.sin(theta) * Math.cos(phi) * r;
                positions[i * 3 + 1] = position.y + Math.sin(phi) * r * 0.5;
                positions[i * 3 + 2] = position.z + Math.cos(theta) * Math.cos(phi) * r;

                const c = baseColor.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.4);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;

                sizes[i] = 0.03 + Math.random() * 0.08;
                velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.12,
                    (Math.random() - 0.5) * 0.12 + 0.04,
                    (Math.random() - 0.5) * 0.12
                ));
                lifetimes.push(0.4 + Math.random() * 0.4);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const mesh = new THREE.Points(geo, mat);
            scene.add(mesh);

            return {
                mesh,
                velocities,
                lifetimes,
                age: 0,
                maxAge: 0.9,
                update(dt) {
                    this.age += dt;
                    const pos = this.mesh.geometry.attributes.position;
                    const arr = pos.array;
                    const life = Math.max(0, 1 - this.age / this.maxAge);
                    this.mesh.material.opacity = life * 0.85;

                    for (let i = 0; i < count; i++) {
                        arr[i * 3] += velocities[i].x * dt * 1.4;
                        arr[i * 3 + 1] += velocities[i].y * dt * 1.4;
                        arr[i * 3 + 2] += velocities[i].z * dt * 1.4;
                        velocities[i].y -= dt * 0.08;
                        velocities[i].x *= 0.99;
                        velocities[i].z *= 0.99;
                    }
                    pos.needsUpdate = true;
                    return this.age < this.maxAge;
                }
            };
        }

        // ─── HAND TRACKING → 3D MAPPING ─────────────────────────
        function mapHandTo3D(landmarks, w, h) {
            if (!landmarks || landmarks.length < 21) return null;

            const wrist = landmarks[0];
            const indexTip = landmarks[8];

            const x = (wrist.x - 0.5) * 9.5;
            const y = (0.5 - wrist.y) * 6.5;
            const z = -1.0 + wrist.z * 7;

            const handSize = Math.sqrt(
                Math.pow(landmarks[5].x - landmarks[17].x, 2) +
                Math.pow(landmarks[5].y - landmarks[17].y, 2) +
                Math.pow(landmarks[5].z - landmarks[17].z, 2)
            );

            const dir = new THREE.Vector3(
                indexTip.x - wrist.x,
                indexTip.y - wrist.y,
                indexTip.z - wrist.z
            ).normalize();

            return {
                pos: new THREE.Vector3(x, y, z),
                dir,
                handSize,
                wrist,
                indexTip,
            };
        }

        // ─── SLICE DETECTION ──────────────────────────────────────
        function checkSlice(handPos, prevPos, handColor, handName) {
            const speed = handPos.distanceTo(prevPos);
            if (speed < 0.04) return;

            const dir = new THREE.Vector3().copy(handPos).sub(prevPos).normalize();

            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];
                if (block.userData.sliced) continue;

                const toBlock = new THREE.Vector3().copy(block.position).sub(handPos);
                const dist = toBlock.length();

                if (dist < CONFIG.sliceRadius * 0.65) {
                    const proj = toBlock.dot(dir);
                    if (proj > -0.3 && proj < 0.7) {
                        const perpDist = toBlock.clone().add(dir.clone().multiplyScalar(-proj)).length();
                        if (perpDist < CONFIG.sliceRadius * 0.55) {
                            // SLICE!
                            block.userData.sliced = true;
                            const pos = block.position.clone();

                            const effect = createSliceEffect(pos, handColor, block.userData.size);
                            slices.push(effect);

                            const bonus = Math.floor(combo / 5) + 1;
                            const points = CONFIG.scorePerSlice + bonus * 10;
                            score += points;
                            combo++;
                            if (combo > maxCombo) maxCombo = combo;
                            totalSliced++;

                            updateUI();

                            scene.remove(block);
                            blocks.splice(i, 1);

                            // small extra pop
                            for (let j = 0; j < 4; j++) {
                                const p = createSliceEffect(
                                    pos.clone().add(new THREE.Vector3(
                                        (Math.random() - 0.5) * 0.5,
                                        (Math.random() - 0.5) * 0.5,
                                        (Math.random() - 0.5) * 0.5
                                    )),
                                    handColor,
                                    0.15
                                );
                                slices.push(p);
                            }

                            if (combo > 0 && combo % 5 === 0) {
                                showComboPopup(combo);
                            }

                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ─── COMBO POPUP ──────────────────────────────────────────
        function showComboPopup(c) {
            const el = document.getElementById('combo-display');
            el.style.transform = 'translateX(-50%) scale(1.25)';
            el.style.color = '#ff88ff';
            setTimeout(() => {
                el.style.transform = 'translateX(-50%) scale(1)';
                el.style.color = '#fff';
            }, 180);
        }

        // ─── UI UPDATE ────────────────────────────────────────────
        function updateUI() {
            scoreNum.textContent = score;
            comboNum.textContent = combo;
        }

        // ─── MISS HANDLER ──────────────────────────────────────────
        function handleMiss() {
            combo = 0;
            totalMissed++;
            updateUI();
            missOverlay.classList.add('show');
            setTimeout(() => missOverlay.classList.remove('show'), 280);
        }

        // ─── SPAWN BLOCKS ──────────────────────────────────────────
        function spawnBlock() {
            if (blocks.length >= CONFIG.maxBlocks) return;
            const block = createBlock();
            scene.add(block);
            blocks.push(block);
        }

        // ─── UPDATE BLOCKS ─────────────────────────────────────────
        function updateBlocks(dt) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];
                block.position.z += block.userData.speed * dt * 2.2;

                block.rotation.x += block.userData.rotSpeed.x;
                block.rotation.y += block.userData.rotSpeed.y;
                block.rotation.z += block.userData.rotSpeed.z;

                const pulse = 0.85 + 0.15 * Math.sin(Date.now() * 0.004 + i);
                block.material.emissiveIntensity = 0.08 + pulse * 0.12;

                if (block.position.z > CONFIG.zNear) {
                    if (!block.userData.sliced) {
                        handleMiss();
                    }
                    scene.remove(block);
                    blocks.splice(i, 1);
                }
            }
        }

        // ─── UPDATE SABER (smooth) ───────────────────────────────
        function updateSaber(hand, dt) {
            const trail = hand.trail;
            trail.push(hand.pos.clone());
            if (trail.length > CONFIG.trailLength) trail.shift();

            if (hand.saber) {
                hand.saber.position.copy(hand.pos);

                if (hand.vel.length() > 0.008) {
                    const lookTarget = hand.pos.clone().add(hand.vel.clone().normalize());
                    hand.saber.lookAt(lookTarget);
                } else {
                    hand.saber.rotation.set(0, 0, 0);
                }

                // slight tilt
                hand.saber.rotation.z += hand.vel.x * 0.15;
                hand.saber.rotation.x += hand.vel.y * 0.08;

                const intensity = Math.min(0.4 + hand.vel.length() * 1.5, 1.6);
                const light = hand.saber.children.find(c => c.isPointLight);
                if (light) light.intensity = intensity * 0.4;

                const blade = hand.saber.children.find(c => c.isMesh && c.geometry.type === 'CylinderGeometry');
                if (blade) {
                    blade.material.opacity = 0.6 + Math.min(hand.vel.length() * 2.5, 0.4);
                }
            }
        }

        // ─── RENDER LOOP ───────────────────────────────────────────
        let lastTime = 0;

        function animate(time) {
            const dt = Math.min((time - lastTime) / 16.667, 2.5);
            lastTime = time;

            // spawn
            if (time - lastSpawnTime > CONFIG.spawnInterval) {
                spawnBlock();
                if (Math.random() < 0.15 && blocks.length < CONFIG.maxBlocks - 2) {
                    setTimeout(() => spawnBlock(), 80);
                }
                lastSpawnTime = time;
            }

            updateBlocks(dt);

            // update slice effects
            for (let i = slices.length - 1; i >= 0; i--) {
                const s = slices[i];
                const alive = s.update(dt);
                if (!alive) {
                    scene.remove(s.mesh);
                    slices.splice(i, 1);
                }
            }

            // update sabers
            for (const key of ['left', 'right']) {
                const hand = hands[key];
                if (hand.active && hand.saber) {
                    updateSaber(hand, dt);
                }
            }

            // auto-spawn
            if (blocks.length < 6 && Math.random() < 0.04) {
                spawnBlock();
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ─── RESIZE ────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ─── MEDIAPIPE HANDS ──────────────────────────────────────
        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                for (const key of ['left', 'right']) {
                    hands[key].active = false;
                    if (hands[key].saber) {
                        hands[key].saber.visible = false;
                    }
                }
                return;
            }

            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i]?.label || 'Right';
                const isLeft = handedness === 'Left';

                // INVERTED: left hand → right saber, right hand → left saber
                const key = isLeft ? 'left' : 'right';
                const hand = hands[key];

                const mapped = mapHandTo3D(landmarks, w, h);
                if (!mapped) continue;

                const targetPos = mapped.pos;
                if (hand.active) {
                    hand.pos.lerp(targetPos, CONFIG.handSmooth);
                } else {
                    hand.pos.copy(targetPos);
                    hand.active = true;
                }

                hand.prevPos.copy(hand.pos);
                hand.vel.copy(hand.pos).sub(hand.prevPos).multiplyScalar(1 / 0.016);

                // Create saber with INVERTED color (left hand gets right saber color, etc.)
                if (!hand.saber) {
                    // INVERTED: left hand uses right saber color, right hand uses left saber color
                    const saberColor = hand.saberColor;
                    hand.saber = createSaber(saberColor);
                    scene.add(hand.saber);
                }
                hand.saber.visible = true;
                hand.landmarks = landmarks;

                // Check slices with the hand's position
                if (hand.prevPos && hand.pos) {
                    checkSlice(hand.pos, hand.prevPos, hand.saberColor, key);
                }

                hand.prevPos.copy(hand.pos);
            }

            for (const key of ['left', 'right']) {
                if (!hands[key].active) {
                    if (hands[key].saber) hands[key].saber.visible = false;
                }
            }
        }

        // ─── INIT MEDIAPIPE ──────────────────────────────────────
        const handsInstance = new Hands({
            locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        handsInstance.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.6,
        });

        handsInstance.onResults(onResults);

        // ─── CAMERA ────────────────────────────────────────────────
        const cameraHelper = new Camera(video, {
            onFrame: async () => {
                try {
                    await handsInstance.send({ image: video });
                } catch (e) {
                    // silent
                }
            },
            width: 640,
            height: 480,
        });

        cameraHelper.start();

        // ─── START GAME ────────────────────────────────────────────
        updateUI();
        requestAnimationFrame(animate);

        // initial blocks
        for (let i = 0; i < 8; i++) {
            setTimeout(() => spawnBlock(), i * 100);
        }

        console.log('🔥 Beat Saber – Inverted Controls!');
        console.log('🔄 Left hand → Right saber · Right hand → Left saber');
        console.log('✋ Pure hand tracking · No keyboard needed');
    </script>
</body>
</html>
